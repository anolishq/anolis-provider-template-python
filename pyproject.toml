[project]
name = "anolis-provider-template-python"
version = "0.1.0"
description = "Template for an Anolis device provider in Python: simulated heaters on the Python provider SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    # The Python provider SDK. Not on PyPI yet: pinned to a commit on its main branch.
    "anolis-provider-sdk @ git+https://github.com/anolishq/anolis-provider-sdk-python@a92828a3acaa8c2df7dc5d6d5724579164222308",
]

[project.optional-dependencies]
dev = [
    "anolis-protocol[conformance] @ https://github.com/anolishq/anolis-protocol/releases/download/v1.10.0/anolis_protocol-1.10.0-py3-none-any.whl",
    "ruff>=0.15.0,<1.0.0",
    "mypy>=1.13",
    "pytest>=8",
    "types-PyYAML>=6.0",
    "types-protobuf>=5",
    "types-jsonschema>=4.17",
]
freeze = [
    "pyinstaller>=6.10,<7",
]

[project.scripts]
anolis-provider-template-python = "anolis_provider_template_python.provider:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/anolis_provider_template_python"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Generated protobuf modules ship without type stubs.
module = ["anolis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = ["conformance: runs the anolis-protocol conformance harness against the provider"]
